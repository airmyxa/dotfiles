user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Caching configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=config_cache:10m max_size=1g 
                    inactive=60m use_temp_path=off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=config_api:10m rate=10r/s;

    upstream config_http_backend {
        server app:8080;
        # Add more app instances here for load balancing
        # server app2:8080;
        # server app3:8080;
    }

    upstream config_grpc_backend {
        server app:9090;
        # Add more app instances here for load balancing
        # server app2:9090;
        # server app3:9090;
    }

    server {
        listen 80;
        server_name config-service.example.com;

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name config-service.example.com;

        ssl_certificate /etc/nginx/ssl/config-service.crt;
        ssl_certificate_key /etc/nginx/ssl/config-service.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HTTP API
        location /api/ {
            # Apply rate limiting
            limit_req zone=config_api burst=20 nodelay;

            # Enable caching for GET requests
            proxy_cache config_cache;
            proxy_cache_methods GET;
            proxy_cache_valid 200 10m;
            proxy_cache_key $scheme$proxy_host$request_uri$arg_timestamp;
            proxy_ignore_headers Cache-Control;
            add_header X-Cache-Status $upstream_cache_status;

            # Do not cache if timestamp is not provided (latest version)
            proxy_cache_bypass $arg_timestamp;
            proxy_no_cache $arg_timestamp;

            proxy_pass http://config_http_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://config_http_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Don't cache health checks
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # gRPC service
        location /config.ConfigService/ {
            grpc_pass grpc://config_grpc_backend;
        }
    }
} 