openapi: 3.0.0
info:
  title: Config Provider API
  description: API for managing configuration data
  version: 1.0.0
servers:
  - url: 'http://localhost:8080'
    description: Local development server

paths:
  /configs:
    post:
      summary: Create a new configuration
      operationId: createConfig
      tags:
        - configs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConfigRequest'
      responses:
        '200':
          description: Config created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          description: Invalid request
        '500':
          description: Internal server error

  /configs/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Name of the configuration
    get:
      summary: Get a configuration
      operationId: getConfig
      tags:
        - configs
      parameters:
        - name: timestamp
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Get the configuration as it was at a specific time (RFC3339 format)
      responses:
        '200':
          description: Config retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          description: Invalid timestamp format
        '500':
          description: Internal server error
    put:
      summary: Update a configuration
      operationId: updateConfig
      tags:
        - configs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConfigRequest'
      responses:
        '200':
          description: Config updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
    delete:
      summary: Delete a configuration
      operationId: deleteConfig
      tags:
        - configs
      responses:
        '204':
          description: Config deleted successfully
        '500':
          description: Internal server error

  /configs/updates:
    get:
      summary: Get configurations updated since a specific time
      operationId: getUpdatedConfigs
      tags:
        - configs
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Get configurations updated since this time (RFC3339 format)
      responses:
        '200':
          description: Updated configurations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Config'
        '400':
          description: Invalid time format
        '500':
          description: Internal server error

  /configs/{name}/metadata:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Name of the configuration
    post:
      summary: Create metadata for a configuration
      operationId: createMetadata
      tags:
        - metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataRequest'
      responses:
        '200':
          description: Metadata created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigMetadata'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
    get:
      summary: Get metadata for a configuration
      operationId: getMetadata
      tags:
        - metadata
      responses:
        '200':
          description: Metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigMetadata'
        '500':
          description: Internal server error
    put:
      summary: Update metadata for a configuration
      operationId: updateMetadata
      tags:
        - metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataRequest'
      responses:
        '200':
          description: Metadata updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigMetadata'
        '400':
          description: Invalid request
        '500':
          description: Internal server error

  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      tags:
        - system
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

components:
  schemas:
    CreateConfigRequest:
      type: object
      required:
        - name
        - data
      properties:
        name:
          type: string
          description: Unique name for the configuration
        data:
          type: object
          description: Configuration data (arbitrary JSON)
          additionalProperties: true

    UpdateConfigRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          description: Updated configuration data
          additionalProperties: true

    MetadataRequest:
      type: object
      properties:
        description:
          type: string
          description: Description of the configuration
        maintainers:
          type: array
          items:
            type: string
          description: List of maintainers for the configuration

    Config:
      type: object
      properties:
        name:
          type: string
          description: Unique name of the configuration
        data:
          type: object
          description: Configuration data
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    ConfigMetadata:
      type: object
      properties:
        config_name:
          type: string
          description: Name of the configuration this metadata belongs to
        description:
          type: string
          description: Description of the configuration
        maintainers:
          type: array
          items:
            type: string
          description: List of maintainers for the configuration 