format = """
$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$git_status$custom$hg_branch$pijul_channel$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$sudo$cmd_duration$jobs$battery$time$line_break$status$container$netns$os$shell$character
"""

[package]
disabled = true
# ~/.config/starship.toml

[time]
disabled = false
format = '[$time ]($style)'
time_format = '%T'
utc_time_offset = '+4'

[custom.arc_branch]
command = """ arc branch | grep "^*" | string sub -s 3 """
description = "show current arc branch"
when = """ expr "$(pwd)" : "$HOME/dev/arcadia/" """
symbol = "\ue0a0 "
style = "purple"
format = "[$symbol$output]($style) "
