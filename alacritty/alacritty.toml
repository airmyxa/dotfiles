[terminal.shell]
program = "/opt/homebrew/bin/fish"

[font]
size = 14.0

[font.bold]
family = "Hack Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font Mono"
style = "Italic"

[font.normal]
family = "Hack Nerd Font Mono"
style = "Regular"

[font.offset]
x = 0
y = 4

[keyboard]
bindings = [
  { key = "Left",  mods = "Alt",     chars = "\u001bB"   },
  { key = "Right", mods = "Alt",     chars = "\u001bF"   },
  { key = "Back",  mods = "Alt",     chars = "\u001B\u007F" },
  { key = "Left",  mods = "Command", chars = "\u001bOH"  },
  { key = "Right", mods = "Command", chars =  "\u001bOF" },
  { key = "Back",  mods = "Command", chars = "\u0015"    },
]

[window]
option_as_alt = "OnlyLeft"

[colors.primary]
background = "#1d1f21"
foreground = "#c5c8c6"

# --- Open links with Ctrl+Click even inside tmux ---
[hints]

# 1) OSC-8 hyperlinks (anchor text like "Grafana dashboard")
[[hints.enabled]]
hyperlinks = true
command = "open"                  # macOS; on Linux use: xdg-open
post_processing = true
mouse = { enabled = true, mods = "Command" }  # Ctrl+Click to open

# 2) (Optional) raw printed URLs for tools that don't use OSC-8
[[hints.enabled]]
regex = "(mailto:|git:|ssh:|ftp:|https:|http:|file:)\\S+"
command = "open"
post_processing = true
mouse = { enabled = true, mods = "Command" }

[terminal]
