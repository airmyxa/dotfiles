# ~/.config/fuzzel/fuzzel.ini
# Minimal, Spotlight-like single-line design
# (All color values are RGBA; last two hex chars are alpha.)

[main]
# Top-center like Spotlight (use y-margin to drop it from the very top)
anchor=top
y-margin=72
layer=overlay
lines=0                # single-line box
width=60               # width in "characters"
horizontal-pad=20
vertical-pad=10
inner-pad=0

# Typography
dpi-aware=yes
font=Iosevka Nerd Font:size=15
use-bold=no
prompt="Task: "
placeholder=type and press enter…

# Nice to have
match-counter=no
enable-mouse=yes
namespace=askline      # lets your compositor target this surface by name

[colors]
# Oxocarbon-ish dark glass
background=0f0f12cc    # subtle transparency; tweak 'cc' for more/less
text=ffffffff
input=ffffffff
prompt=bbbbbbff
placeholder=ccccccdd
match=8ab4ffff         # gentle accent for matches
selection=22242aff
selection-text=ffffffff
selection-match=8ab4ffff
counter=93a1a1ff

[border]
width=0
radius=14
